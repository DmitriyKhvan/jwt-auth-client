server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # === Заголовки безопасности ===
    # Запрет MIME-сниффинга (браузер не будет угадывать тип контента)
    add_header X-Content-Type-Options "nosniff" always;
    # Запрет встраивания в iframe с других доменов (защита от clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Блокировка XSS в старых браузерах
    add_header X-XSS-Protection "1; mode=block" always;
    # Какие данные передавать в Referer при переходах
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Принудительное HTTPS (если сайт работает через HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # === Gzip сжатие ===
    # Сжимает ответы для уменьшения трафика
    gzip on;
    # Типы контента, которые нужно сжимать
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # Не сжимать ответы меньше 256 байт (маленькие файлы сжимать неэффективно)
    gzip_min_length 256;
    # Сжимать даже проксированные ответы
    gzip_proxied any;
    # Добавляет заголовок Vary: Accept-Encoding для корректной работы с кэшем
    gzip_vary on;

    # === Кэширование статических ассетов ===
    # Файлы в /assets/ (хэшированные имена от Vite) можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # === Прокси для API-запросов ===
    # Все запросы к /api/ перенаправляются на сервер (внутри Docker-сети)
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # === SPA fallback ===
    # Все маршруты отдавать index.html (React Router обработает их на клиенте)
    location / {
        try_files $uri /index.html;
    }
}